# ════════════════════════════════════════════════════════
#  escola-agent — Spring Boot 4.1.2 + Spring AI 2.0.1
# ════════════════════════════════════════════════════════

spring:
  main:
    web-application-type: none
    banner-mode: "off"

  shell:
    interactive:
      enabled: true

  ai:
    ollama:
      base-url: 'http://localhost:11434'

      # ── Modelo de chat (LLM) ─────────────────────────
      chat:
        model: llama3.2
        temperature: 0.2
        num-ctx: 4096

      # ── Modelo de embedding (RAG) ─────────────────────
      embedding:
        model: nomic-embed-text

    # ── MCP Client ───────────────────────────────────────
#    mcp:
#      client:
#        streamable-http:
#          connections:
#            server1:
#              url: 'http://localhost:8080/mcp/sse'


    mcp:
      client:
        enabled: true
        sse:
          connections:
            local-server:
              url: 'http://localhost:8081'
              sse-endpoint: '/mcp/sse'



logging:
  level:
    root: WARN
    br.com.escola: DEBUG
    # Descomente para ver o prompt completo com os trechos RAG injetados:
    # org.springframework.ai.chat.client: DEBUG
    # Descomente para ver as buscas vetoriais:
    # org.springframework.ai.vectorstore: DEBUG